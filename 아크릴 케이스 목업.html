<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>아크릴 케이스 목업</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:13px/1.5 "Noto Sans KR",system-ui,sans-serif;display:flex}
#v{flex:1;position:relative;min-width:0}canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:14px;bottom:12px;color:var(--mu);font-size:12px;pointer-events:none}
aside{width:320px;background:var(--pn);border-left:1px solid var(--ln);overflow-y:auto;padding:14px}
h1{font-size:16px;margin:0 0 8px}h2{font-size:13px;margin:16px 0 6px;color:var(--ac)}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0;color:var(--mu)}
label b{color:var(--tx);font-weight:500;min-width:40px;text-align:right}
input[type=range]{flex:1;accent-color:var(--ac)}select,button,input[type=number]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:4px 7px}
button{cursor:pointer}.w{width:100%;margin-top:5px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.g input{width:100%;box-sizing:border-box}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.pr{display:flex;align-items:center;gap:6px;margin:3px 0}.pr button{flex:1;text-align:left}.pr button.on{border-color:var(--ac);color:var(--ac);font-weight:600}

@media (max-width:760px){body{flex-direction:column}aside{width:auto;height:50%;border-left:0;border-top:1px solid var(--ln)}}
</style></head><body>
<div id="v"><div id="hint">파츠를 클릭해 선택 · 화살표 축을 끌어 이동/회전 · 빈 곳 드래그로 시점 회전</div></div>
<aside>
<h1>아크릴 케이스 목업</h1>
<h2>파츠 (면마다 이미지)</h2><div id="pl"></div>
<div class="g2"><button id="add">＋ 이미지로 파츠 추가</button><button id="rst">기본 배치로 초기화</button></div>
<input type="file" id="pf" accept="image/*" hidden><input type="file" id="af" accept="image/*" hidden>
<h2>선택한 파츠: <span id="sn" style="color:var(--tx)">없음</span></h2>
<input type="text" id="nm" placeholder="파츠 이름" style="width:100%;box-sizing:border-box;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:4px 7px;margin-bottom:5px">
<div class="g2"><button id="mv">이동</button><button id="rt">회전</button></div>
<div class="g2"><button id="rep">앞면 이미지 교체</button><button id="repb">뒷면 이미지 넣기</button></div>
<div class="g2"><button id="bdel">뒷면 제거</button><button id="flip">시점 앞↔뒤</button></div>
<input type="file" id="bf" accept="image/*" hidden>
<button class="w" id="snap">겹침 해소(두께 방향으로 밀기)</button>
<label><span><input type="checkbox" id="chk" checked> 겹침 검사 (겹치면 붉게 표시)</span></label>
<label><span><input type="checkbox" id="trim" checked> 여백 자동 제거</span><span><input type="checkbox" id="keyc"> 모서리 색 투명</span></label>
<label>이미지 해상도(DPI) → 크기 계산<input type="number" id="dpi" value="300" min="30" max="1200" style="width:70px"></label>
<small>크기(mm) 가로 / 세로</small>
<div class="g2"><input type="number" id="w" step=".5"><input type="number" id="h" step=".5"></div>
<label><span><input type="checkbox" id="lock" checked> 비율 고정</span></label>
<small>위치(mm) X / Y / Z</small><div class="g"><input type="number" id="px" step=".5"><input type="number" id="py" step=".5"><input type="number" id="pz" step=".5"></div>
<small>회전(°) X / Y / Z</small><div class="g"><input type="number" id="rx" step="1"><input type="number" id="ry" step="1"><input type="number" id="rz" step="1"></div>
<div class="g"><button id="x9">X +90°</button><button id="y9">Y +90°</button><button id="z9">Z +90°</button></div>
<label>앞면 흰 잉크<select id="wi"><option value="">재질 따름</option><option value="1">있음(불투명)</option><option value="0.1">없음(투명)</option></select></label>
<label>뒷면 흰 잉크<select id="wi2"><option value="">재질 따름</option><option value="1">있음(불투명)</option><option value="0.1">없음(투명)</option></select></label>
<label>흰 테두리(칼선 여유)<input type="range" id="ol" min="0" max="10" value="0"><b id="olv"></b></label>
<div class="g2"><button id="dup">복제</button><button id="del">삭제</button></div>
<h2>스탠드 꽂는 부분 (선택 파츠)</h2>
<label><span><input type="checkbox" id="tabon"> 꽂는 부분 만들기(아래쪽)</span></label>
<small>폭 / 길이(mm)</small><div class="g2"><input type="number" id="tw" step=".5" value="20"><input type="number" id="tl" step=".5" value="3"></div>
<h2>구멍 (선택 파츠)</h2>
<label><span><input type="checkbox" id="holeon"> 구멍 뚫기</span></label>
<div class="g"><select id="hsel"></select><button id="hadd">＋ 추가</button><button id="hdel">− 삭제</button></div>
<small>위치 X / Y(mm, 판 중심 기준)</small><div class="g2"><input type="number" id="hx" step=".5" value="0"><input type="number" id="hy" step=".5" value="0"></div>
<small>크기 가로 / 세로(mm)</small><div class="g2"><input type="number" id="hw" step=".1" value="10"><input type="number" id="hh" step=".1" value="3"></div>
<label>구멍 회전(°)<input type="number" id="ha" value="0" style="width:70px"></label>
<button class="w" id="aim">스탠드 위치로 구멍 맞추기</button>
<label><span><input type="checkbox" id="mt"> 구멍 = 꽂는 부분 + 공차</span><input type="number" id="tol" value="0.1" step=".05" min="0" style="width:60px"></label>
<h2>파츠 이미지 저장</h2>
<button class="w" id="expp">선택 파츠 저장 (구멍·꽂는 부분 포함)</button>
<button class="w" id="expa">전체 파츠 저장 (zip)</button>
<small>칼선 표시를 켜면 분홍색 칼선이 이미지에 함께 그려집니다.</small>
<h2>맞춤 도구</h2>
<label>이동 스냅<select id="ts"><option value="0">없음</option><option value=".5">0.5mm</option><option value="1">1mm</option><option value="5">5mm</option></select></label>
<label>회전 스냅<select id="rs"><option value="0">없음</option><option value="15">15°</option><option value="45">45°</option><option value="90" selected>90°</option></select></label>
<label>분해 ↔ 조립<input type="range" id="ex" min="0" max="1" step=".01" value="0"></label>
<h2>재질</h2>
<label>종류<select id="mat"><option value="clear">투명 아크릴</option><option value="frost">반투명(프로스트)</option><option value="white">불투명 화이트</option><option value="smoke">스모크</option></select></label>
<label>인쇄 외 바탕 불투명도<input type="range" id="wo" min="0" max="1" step=".01"><b id="wov"></b></label>
<label>광택(낮을수록 반짝)<input type="range" id="ro" min="0" max="1" step=".01" value=".15"><b id="rov"></b></label>
<label>아크릴 두께<input type="range" id="th" min="1" max="10" step=".5" value="3"><b id="thv"></b></label>
<label><span><input type="checkbox" id="cut"> 칼선 표시</span></label>
<button class="w" id="shot">현재 화면 저장(PNG)</button>
</aside>

function list(){const L=$('pl');L.innerHTML='';parts.forEach(p=>{const d=document.createElement('div');d.className='pr';const c=document.createElement('input');c.type='checkbox';c.checked=p.vis;c.onchange=()=>{p.vis=c.checked;p.g.visible=p.vis;attach()};
const b=document.createElement('button');b.textContent=(p.ov?'⚠ ':'')+p.name;b.className=p===sel?'on':'';b.onclick=()=>choose(p);d.append(c,b);L.appendChild(d)})}
function choose(p){sel=p;attach();list();sync()}
function addPart(name,src,w,pos,rot,ol){const p={id:++pid,name,src,w,h:w*src.height/src.width,pos,rot,ol:ol||0,vis:true};parts.push(p);build(p);return p}
function init(){parts.forEach(p=>root.remove(p.g));parts=[];sel=null;tc.detach();const t=+$('th').value,W=100,H=71,D=52,C={front:'#8fa3d6',back:'#d68f9b',left:'#8fd6b0',right:'#d6c98f',top:'#b08fd6',bottom:'#8fd0d6',fig:'#e08a5a'};
const a=(k,w,h,pos,rot)=>{const c=cv(Math.round(w*4),Math.round(h*4)),x=c.getContext('2d');x.fillStyle=C[k];x.fillRect(0,0,c.width,c.height);return addPart(NM[k],c,w,pos,rot)};
a('front',W,H,[0,0,D/2+t/2],[0,0,0]);a('back',W,H,[0,0,-D/2-t/2],[0,180,0]);a('left',D,H-2*t,[-(W/2-t/2),0,0],[0,-90,0]);a('right',D,H-2*t,[W/2-t/2,0,0],[0,90,0]);
a('top',W,D,[0,H/2-t/2,0],[-90,0,0]);a('bottom',W,D,[0,-(H/2-t/2),0],[90,0,0]);a('fig',40,50,[0,-H/2+t+25,0],[0,0,0]);list();sync()}
function load(file,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{let c=cv(i.width,i.height);c.getContext('2d').drawImage(i,0,0);
if($('keyc').checked){const d=c.getContext('2d').getImageData(0,0,1,1).data;keyBg(c,[d[0],d[1],d[2]])}if($('trim').checked)c=trim(c);cb(c,file.name.replace(/\.[^.]+$/,''))};i.src=r.result};r.readAsDataURL(file)}
$('rep').onclick=()=>sel&&$('pf').click();$('add').onclick=()=>$('af').click();
$('pf').onchange=e=>{const f=e.target.files[0];if(f&&sel)load(f,c=>{const m=25.4/Math.max(30,+$('dpi').value||300);sel.src=c;sel.w=c.width*m;sel.h=c.height*m;build(sel);sync()});e.target.value=''};
$('af').onchange=e=>{const f=e.target.files[0];if(f)load(f,(c,n)=>choose(addPart(n,c,c.width*25.4/Math.max(30,+$('dpi').value||300),[0,0,0],[0,0,0])));e.target.value=''};
FD.forEach(id=>$(id).oninput=()=>{const p=sel;if(!p||$(id).value==='')return;const v=+$(id).value;
if(id=='w'){p.w=v;if($('lock').checked)p.h=v*p.src.height/p.src.width}else if(id=='h'){p.h=v;if($('lock').checked)p.w=v*p.src.width/p.src.height}
else if(id[0]=='p')p.pos['xyz'.indexOf(id[1])]=v;else p.rot['xyz'.indexOf(id[1])]=v;
if(id=='w'||id=='h'){build(p);sync()}else{place(p);sched()}});
['x','y','z'].forEach((a,i)=>$(a+'9').onclick=()=>{if(!sel)return;sel.rot[i]=((sel.rot[i]+90)%360);place(sel);sync();sched()});
$('ol').oninput=()=>{if(sel){sel.ol=+$('ol').value;build(sel);sync()}};
$('dup').onclick=()=>{if(sel){const n=addPart(sel.name+' 복사',sel.src,sel.w,[sel.pos[0]+10,sel.pos[1],sel.pos[2]],[...sel.rot],sel.ol);n.src2=sel.src2;n.wi=sel.wi;n.wi2=sel.wi2;n.tab=sel.tab&&{...sel.tab};n.holes=sel.holes&&sel.holes.map(h=>({...h}));n.hon=sel.hon;n.hi=0;build(n);choose(n)}};
$('del').onclick=()=>{if(!sel)return;root.remove(sel.g);parts=parts.filter(p=>p!==sel);sel=null;tc.detach();list();sync();sched()};
$('nm').oninput=()=>{if(sel){sel.name=$('nm').value;$('sn').textContent=sel.name;list()}};
$('wi').onchange=()=>{if(sel){sel.wi=$('wi').value;build(sel)}};$('wi2').onchange=()=>{if(sel){sel.wi2=$('wi2').value;build(sel)}};
const tabU=()=>{if(!sel)return;sel.tab={on:$('tabon').checked,w:+$('tw').value||1,l:+$('tl').value||0};buildAll();sync()};
['tabon','tw','tl'].forEach(i=>$(i).oninput=tabU);
const holeU=()=>{if(!sel)return;sel.hon=$('holeon').checked;if(sel.hon&&!(sel.holes&&sel.holes.length)){sel.holes=[{x:0,y:0,w:10,h:+$('th').value,a:0}];sel.hi=0}
const H=sel.holes&&sel.holes[sel.hi||0];if(H){H.x=+$('hx').value;H.y=+$('hy').value;H.w=+$('hw').value||1;H.h=+$('hh').value||1;H.a=+$('ha').value}$('mt').checked?buildAll():build(sel);sync()};
$('hadd').onclick=()=>{if(!sel)return;sel.holes=sel.holes||[];sel.holes.push({x:12*sel.holes.length,y:0,w:10,h:+$('th').value,a:0});sel.hi=sel.holes.length-1;sel.hon=true;build(sel);sync()};
$('hdel').onclick=()=>{if(!sel||!sel.holes||!sel.holes.length)return;sel.holes.splice(sel.hi||0,1);sel.hi=Math.max(0,(sel.hi||0)-1);build(sel);sync()};
$('hsel').onchange=()=>{if(sel){sel.hi=+$('hsel').value;sync()}};
let DL=null;try{claude.use('downloads').then(d=>DL=d).catch(()=>{})}catch(e){}
const blobOf=c=>new Promise(r=>c.toBlob(r,'image/png')),fn=s=>(s||'part').replace(/[\\/:*?"<>|]/g,'_');
async function save(name,data){if(!DL){alert('이 화면에서는 파일 저장을 지원하지 않습니다. claude.ai에서 열어주세요.');return}try{await DL.save({filename:name,data})}catch(e){}}
const expC=(p,o)=>{const q={...o,wo:1,ol:p.ol},n=fn(p.name);return[[n+'_앞',proc(prep(p.src,p,o),q).pc]].concat(p.src2?[[n+'_뒤',proc(prep(p.src2,p,o),q).pc]]:[])};
$('expp').onclick=async()=>{if(!sel)return;const fs=expC(sel,gopt());if(fs.length==1)save(fs[0][0]+'.png',await blobOf(fs[0][1]));else{const z=new JSZip();for(const[n,c]of fs)z.file(n+'.png',await blobOf(c));save(fn(sel.name)+'.zip',await z.generateAsync({type:'blob'}))}};
$('expa').onclick=async()=>{const z=new JSZip();for(const p of parts)for(const[n,c]of expC(p,gopt()))z.file(n+'.png',await blobOf(c));save('acrylic-parts.zip',await z.generateAsync({type:'blob'}))};
['holeon','hx','hy','hw','hh','ha'].forEach(i=>$(i).oninput=holeU);
$('mt').onchange=$('tol').oninput=()=>{buildAll();sync()};
$('aim').onclick=()=>{const B=sel,A=parts.find(q=>q.tab&&q.tab.on&&q!==B);if(!B||!A||+$('ex').value)return;root.updateMatrixWorld(true);
const v=A.g.localToWorld(new THREE.Vector3(0,-(A.h/2+A.tab.l/2),0));B.g.worldToLocal(v);
const d=new THREE.Vector3(1,0,0).applyQuaternion(A.g.quaternion).applyQuaternion(B.g.quaternion.clone().invert());
B.holes=B.holes||[];if(!B.holes.length)B.holes.push({x:0,y:0,w:10,h:+$('th').value,a:0});const hq=B.holes[B.hi||0]||B.holes[0];hq.x=+v.x.toFixed(2);hq.y=+v.y.toFixed(2);hq.a=Math.round(Math.atan2(d.y,d.x)*180/Math.PI);B.hon=true;build(B);sync()};
$('repb').onclick=()=>sel&&$('bf').click();
$('bf').onchange=e=>{const f=e.target.files[0];if(f&&sel)load(f,c=>{sel.src2=c;build(sel)});e.target.value=''};
$('bdel').onclick=()=>{if(sel&&sel.src2){sel.src2=null;build(sel)}};
$('flip').onclick=()=>{cam.position.x*=-1;cam.position.z*=-1};$('chk').onchange=sched;
$('snap').onclick=()=>{const p=sel;if(!p||+$('ex').value)return;const base=[...p.pos],nrm=new THREE.Vector3(0,0,1).applyEuler(new THREE.Euler(...p.rot.map(dg)));
const hit=()=>{place(p);root.updateMatrixWorld(true);return parts.some(q=>q!==p&&q.vis&&ovl(p,q)>3)};
if(!hit())return;for(let d=.25;d<=10;d+=.25)for(const s of[1,-1]){p.pos=base.map((v,i)=>v+nrm.getComponent(i)*d*s);if(!hit()){sync();sched();return}}p.pos=base;place(p);sync()};
$('mv').onclick=()=>tc.setMode('translate');$('rt').onclick=()=>tc.setMode('rotate');
$('ts').onchange=()=>tc.setTranslationSnap(+$('ts').value||null);$('rs').onchange=()=>tc.setRotationSnap(+$('rs').value?dg(+$('rs').value):null);
$('ts').onchange();$('rs').onchange();
$('mat').onchange=()=>{$('wo').value=P[$('mat').value][0];buildAll()};
['wo','ro','th','cut'].forEach(i=>$(i).addEventListener('input',buildAll));
$('ex').oninput=()=>{parts.forEach(place);attach();sched()};$('rst').onclick=()=>init();
$('shot').onclick=async()=>{const v=tc.visible;tc.visible=false;ren.render(sc,cam);const pr=blobOf(ren.domElement);tc.visible=v;save('acrylic-mockup.png',await pr)};
let dn=null;const rc=new THREE.Raycaster(),cvs=ren.domElement;
cvs.addEventListener('pointerdown',e=>dn=[e.clientX,e.clientY]);
cvs.addEventListener('pointerup',e=>{if(!dn||tc.dragging||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;const r=cvs.getBoundingClientRect();
rc.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-((e.clientY-r.top)/r.height*2-1)},cam);const h=rc.intersectObjects(root.children.filter(g=>g.visible),true)[0];
if(h){let o=h.object;while(o&&o.userData.pid==null)o=o.parent;const p=parts.find(q=>q.id==o.userData.pid);if(p)choose(p)}});
$('wo').value=P.clear[0];size();init();
(function loop(){requestAnimationFrame(loop);if(chk){chk=false;overlap()}ctl.update();ren.render(sc,cam)})();
</script></body></html>
